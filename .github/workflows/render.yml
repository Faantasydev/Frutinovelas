name: Render episode
run-name: Frutinovelas:${{ inputs.owner_id || 'ci' }}:${{ inputs.job_id || github.run_id }}:${{ inputs.episode_title || 'demo' }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      owner_id:
        description: Private session identifier
        required: true
        type: string
      job_id:
        description: Unique render job identifier
        required: true
        type: string
      script_json:
        description: Episode script JSON
        required: true
        type: string
      episode_title:
        description: Episode title
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install dependencies
        run: npm ci
      - name: Test, typecheck, and build
        run: npm test && npm run typecheck && npm run build
      - name: Validate submitted episode props
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EPISODE_SCRIPT_JSON: ${{ inputs.script_json }}
          EPISODE_TITLE: ${{ inputs.episode_title }}
          JOB_ID: ${{ inputs.job_id }}
          OWNER_ID: ${{ inputs.owner_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const script = JSON.parse(process.env.EPISODE_SCRIPT_JSON);
          if (!/^[0-9a-f-]{36}$/i.test(process.env.JOB_ID) || !/^[0-9a-f-]{36}$/i.test(process.env.OWNER_ID)) throw new Error('Invalid render identifiers');
          if (typeof script.title !== 'string' || script.title.length < 1 || script.title.length > 80 || script.title !== process.env.EPISODE_TITLE || !Array.isArray(script.shots) || script.shots.length < 1 || script.shots.length > 20) throw new Error('Invalid episode script');
          let cursor = 0;
          for (const shot of script.shots) {
            if (!shot || typeof shot !== 'object' || !Number.isInteger(shot.start) || !Number.isInteger(shot.end) || shot.start !== cursor || shot.end - shot.start < 15 || shot.end - shot.start > 1800 || !['fresa','banano'].includes(shot.speaker) || !['wide','close'].includes(shot.camera) || typeof shot.text !== 'string' || !shot.text.trim() || shot.text.length > 500) throw new Error('Invalid scene in episode script');
            cursor = shot.end;
          }
          if (cursor > 1800) throw new Error('Episode is longer than 60 seconds');
          fs.writeFileSync('/tmp/frutinovelas-props.json', JSON.stringify({script}));
          NODE
      - name: Render submitted episode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run render -- --props=/tmp/frutinovelas-props.json
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Render demo episode
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: npm run render
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Verify MP4 metadata and decode
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,duration -of json out/frutinovelas.mp4 > /tmp/video.json
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('/tmp/video.json')); const s=x.streams[0]; if(s.codec_name!=='h264'||s.width!==1080||s.height!==1920||s.r_frame_rate!=='30/1'||Number(s.duration)<0.5||Number(s.duration)>60.04) { console.error(s); process.exit(1) } console.log(s)"
          ffmpeg -v error -i out/frutinovelas.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: frutinovelas-${{ inputs.owner_id || 'ci' }}-${{ inputs.job_id || github.run_id }}
          path: out/frutinovelas.mp4
          if-no-files-found: error
